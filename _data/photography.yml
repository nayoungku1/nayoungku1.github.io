# Photography archive. Rendered on /photography/ (see _pages/photography.md).
#
# 1. Put image files in /images/photography/ (long edge ~1600px, JPEG, <500KB is plenty).
# 2. Add one entry per photo below. Newest `date` is shown first.
#
# Fields:
#   file     (required) file name inside /images/photography/
#   title    (required) short title, shown in the enlarged view
#   date     (optional) YYYY-MM-DD, used for ordering
#   location (optional) e.g. "Pohang, Korea"
#   caption  (optional) one or two sentences
#   album    (optional) photos with the same album are grouped under one heading
#   thumb    (optional) smaller image in /images/photography/ for the grid
#   alt      (optional) alt text; falls back to title
#
# Example (remove the leading "# " to use):
# - file: sunrise-pohang.jpg
#   title: "Sunrise at Hwanho Park"
#   date: 2025-11-02
#   location: "Pohang, Korea"
#   caption: "Early morning before the lab."
#   album: "Pohang"
